<!DOCTYPE html>
<html>
<head>
    <title>Experiment 13 - Responsive Design</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
            color: white;
        }

        header {
            padding: 40px;
            text-align: center;
            background: #111c32;
        }

        header h1 {
            color: #67e8f9;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;

            display: flex;
            gap: 25px;
        }

        .card {
            flex: 1;
            padding: 35px;

            background: #101d31;
            border: 1px solid #263957;
            border-radius: 18px;

            text-align: center;
        }

        .card h2 {
            color: #a78bfa;
        }

        .card p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        /* Responsive Design */

        @media (max-width: 768px) {

            .container {
                flex-direction: column;
                margin: 25px;
            }

            header h1 {
                font-size: 28px;
            }

            .card {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<header>
    <h1>Responsive Webpage</h1>
    <p>Resize the browser window to see the effect.</p>
</header>

<div class="container">

    <div class="card">
        <h2>HTML</h2>
        <p>HTML creates the structure of a webpage.</p>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>CSS controls the appearance of a webpage.</p>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>JavaScript adds functionality to webpages.</p>
    </div>

</div>

</body>
</html>
