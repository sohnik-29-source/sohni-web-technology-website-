<!DOCTYPE html>
<html>
<head>
    <title>Experiment 6 - Audio and Video</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
            color: white;
            padding: 50px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #101d31;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            color: #67e8f9;
        }

        h2 {
            color: #a78bfa;
            margin-top: 35px;
        }

        audio, video {
            width: 100%;
            max-width: 700px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Audio and Video Elements</h1>

    <h2>Audio</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <h2>Video</h2>

    <video controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

</div>

</body>
</html>
