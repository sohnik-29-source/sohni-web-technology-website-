<!DOCTYPE html>
<html>
<head>
    <title>Experiment 8 - Semantic HTML</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
            color: white;
        }

        header {
            padding: 35px;
            text-align: center;
            background: #111c32;
        }

        header h1 {
            color: #67e8f9;
        }

        nav {
            padding: 18px;
            text-align: center;
            background: #0f172a;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        section {
            padding: 40px;
            max-width: 1000px;
            margin: auto;
        }

        article {
            padding: 30px;
            background: #101d31;
            border: 1px solid #263957;
            border-radius: 18px;
        }

        footer {
            padding: 25px;
            text-align: center;
            color: #94a3b8;
            border-top: 1px solid #263957;
        }
    </style>
</head>

<body>

<header>
    <h1>Web Laboratory</h1>
    <p>Semantic HTML Elements</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<section>

    <article>

        <h2>Semantic HTML</h2>

        <p>
            Semantic elements clearly describe the purpose
            of the content they contain.
        </p>

        <p>
            Examples include header, nav, section,
            article and footer.
        </p>

    </article>

</section>

<footer>
    © 2026 Web Laboratory
</footer>

</body>
</html>
