<!DOCTYPE html>
<html>
<head>
    <title>Experiment 10 - College Timetable</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
            color: white;
            padding: 50px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: #101d31;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            color: #67e8f9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid #475569;
            padding: 15px;
            text-align: center;
        }

        th {
            background: #312e81;
        }

        td {
            color: #cbd5e1;
        }
    </style>
</head>

<body>

</div>

</body>
</html>
