<!DOCTYPE html>
<html>
<head>
    <title>Experiment 11 - Internal and External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: #67e8f9;
            text-align: center;
        }

        .internal {
            color: #c4b5fd;
            text-align: center;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Internal and External CSS</h1>

    <p class="internal">
        This paragraph is styled using internal CSS.
    </p>

    <div class="external">
        This box is styled using external CSS.
    </div>

</div>

</body>
</html>
