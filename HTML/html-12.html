<!DOCTYPE html>
<html>
<head>
    <title>Experiment 12 - CSS Properties</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 50px;
            background: #07111f;
            color: white;
            font-family: Arial;
        }

        #main-title {
            color: #67e8f9;
            text-align: center;
        }

        .box {
            max-width: 800px;
            margin: 40px auto;
            padding: 35px;

            background: #101d31;

            border: 2px solid #7c3aed;
            border-radius: 18px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.7;
        }

        .highlight {
            color: #a78bfa;
            font-weight: bold;
        }

        button {
            padding: 12px 25px;
            margin-top: 20px;

            background: #7c3aed;
            color: white;

            border: none;
            border-radius: 8px;
        }

    </style>
</head>

<body>

<h1 id="main-title">CSS Styling Demonstration</h1>

<div class="box">

    <h2>CSS Selectors</h2>

    <p>
        CSS is used to style HTML elements.
    </p>

    <p class="highlight">
        This text demonstrates class selector styling.
    </p>

    <p>
        This box demonstrates colors, fonts,
        margins, padding and borders.
    </p>

    <button>Styled Button</button>

</div>

</body>
</html>
