<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Experiment 14 - Bootstrap</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #07111f;
            color: white;
        }

        .main {
            min-height: 100vh;
            padding: 80px 20px;
        }

        .custom-card {
            background: #101d31;
            border: 1px solid #263957;
            color: white;
        }

        h1 {
            color: #67e8f9;
        }

    </style>

</head>

<body>

<div class="container main">

    <h1 class="text-center mb-5">
        Bootstrap Components
    </h1>

    <!-- Alert -->

    <div class="alert alert-info">
        Welcome to Bootstrap Web Laboratory.
    </div>


    <!-- Cards -->

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card custom-card p-4">

                <h3>HTML</h3>

                <p>
                    Structure your webpages using HTML.
                </p>

                <button class="btn btn-primary">
                    Learn More
                </button>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card custom-card p-4">

                <h3>CSS</h3>

                <p>
                    Style your webpages using CSS.
                </p>

                <button class="btn btn-success">
                    Learn More
                </button>

            </div>

        </div>


        <div class="col-md-4">

            <div class="card custom-card p-4">

                <h3>JavaScript</h3>

                <p>
                    Add functionality using JavaScript.
                </p>

                <button class="btn btn-warning">
                    Learn More
                </button>

            </div>

        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
