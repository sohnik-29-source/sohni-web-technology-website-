<!DOCTYPE html>
<html>
<head>
    <title>Experiment 7 - Iframe</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
            color: white;
            padding: 50px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #101d31;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            color: #67e8f9;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #334155;
            border-radius: 15px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>HTML Iframe</h1>

    <p>
        An iframe is used to display another webpage inside
        the current webpage.
    </p>

    <iframe
        src="https://www.wikipedia.org"
        title="Wikipedia">
    </iframe>

</div>

</body>
</html>
