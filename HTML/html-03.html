<!DOCTYPE html>
<html>
<head>
    <title>Experiment 3 - Tables</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
            color: white;
            padding: 50px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #101d31;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            color: #67e8f9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th, td {
            border: 1px solid #475569;
            padding: 15px;
            text-align: center;
        }

        th {
            background: #312e81;
            color: white;
        }

        td {
            color: #cbd5e1;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Information Table</h1>

    <table>

        <tr>
            <th colspan="3">Student Details</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Navya</td>
            <td>B.Tech</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>BCA</td>
            <td>85</td>
        </tr>

        <tr>
            <td rowspan="2">Priya</td>
            <td>Data Science</td>
            <td>92</td>
        </tr>

        <tr>
            <td colspan="2">Excellent Performance</td>
        </tr>

    </table>

</div>

</body>
</html>
