<!DOCTYPE html>
<html>
<head>
    <title>Experiment 4 - Images and Hyperlinks</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
            color: white;
            padding: 50px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            text-align: center;
            background: #101d31;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            color: #67e8f9;
        }

        img {
            width: 400px;
            max-width: 100%;
            border-radius: 20px;
            margin: 25px;
        }

        a {
            display: inline-block;
            padding: 14px 25px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        a:hover {
            background: #0891b2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Images and Hyperlinks</h1>

    <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085"
         alt="Computer">

    <p>Click below to visit Google.</p>

    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

</div>

</body>
</html>
