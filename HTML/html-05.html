<!DOCTYPE html>
<html>
<head>
    <title>Experiment 5 - Registration Form</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
            color: white;
            padding: 50px;
        }

        .form-box {
            max-width: 600px;
            margin: auto;
            padding: 40px;
            background: #101d31;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            color: #67e8f9;
        }

        label {
            display: block;
            margin-top: 18px;
            color: #cbd5e1;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0891b2;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h1>Student Registration</h1>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Enter password">

        <label>Gender</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <label>Course</label>

        <select>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>B.Sc</option>
        </select>

        <label>Address</label>

        <textarea rows="4"></textarea>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
