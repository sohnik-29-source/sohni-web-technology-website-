```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .column {
            padding: 40px;
            background: #101d31;
            border-radius: 15px;
        }

        h2 {
            color: #22d3ee;
        }

        @media (max-width: 700px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Two-Column Layout</h1>

    <div class="layout">

        <div class="column">
            <h2>Column One</h2>
            <p>This is the first column.</p>
        </div>

        <div class="column">
            <h2>Column Two</h2>
            <p>This is the second column.</p>
        </div>

    </div>

</body>

</html>
