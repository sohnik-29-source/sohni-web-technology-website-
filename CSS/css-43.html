```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .gallery {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .blur {
            filter: blur(4px);
        }

        .grayscale {
            filter: grayscale(100%);
        }

        .brightness {
            filter: brightness(150%);
        }

        .contrast {
            filter: contrast(180%);
        }
    </style>
</head>

<body>

    <h1>CSS Filters</h1>

    <div class="gallery">

        <img class="blur"
             src="https://picsum.photos/300/200?1"
             alt="Blur">

        <img class="grayscale"
             src="https://picsum.photos/300/200?2"
             alt="Grayscale">

        <img class="brightness"
             src="https://picsum.photos/300/200?3"
             alt="Brightness">

        <img class="contrast"
             src="https://picsum.photos/300/200?4"
             alt="Contrast">

    </div>

</body>

</html>
