<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions</title>

    <style>
        body {
            margin: 0;
            padding: 80px;
            background: #07111f;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            width: 180px;
            height: 180px;
            margin: auto;
            background: #22d3ee;
            transition: 0.5s;
        }

        .box:hover {
            width: 250px;
            height: 250px;
            background: #8b5cf6;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <h1>CSS Transition</h1>

    <div class="box"></div>

</body>

</html>
