<!DOCTYPE html>
<html>
<head>
    <title>Font Properties</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 50px;
        }

        h1 {
            font-family: Georgia;
            font-size: 40px;
            font-weight: bold;
            font-style: italic;
            color: #67e8f9;
        }

        p {
            font-size: 20px;
            font-weight: normal;
            text-align: justify;
            text-transform: capitalize;
            text-decoration: underline;
            letter-spacing: 1px;
            word-spacing: 5px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>Font Properties</h1>

    <p>
        CSS provides different font properties and text
        formatting properties.
    </p>

</body>
</html>
