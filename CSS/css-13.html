<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 50px;
        }

        form {
            width: 400px;
            margin: auto;
            padding: 30px;
            background: #101d31;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #67e8f9;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            background: #07111f;
            color: white;
            border: 1px solid #334155;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

    <form>

        <h1>Registration</h1>

        <label>Name</label>
        <input type="text">

        <label>Email</label>
        <input type="email">

        <label>Password</label>
        <input type="password">

        <button>Register</button>

    </form>

</body>
</html>
