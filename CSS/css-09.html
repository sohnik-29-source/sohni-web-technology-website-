```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Styled Navigation Bar</title>

    <style>

        /* Navigation Bar */
        nav {
            background-color: #101d31;
            padding: 18px;
            text-align: center;
        }

        /* Navigation Links */
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
            padding: 10px 15px;
            border-radius: 8px;
        }

        /* Hover Effect */
        nav a:hover {
            background-color: #22d3ee;
            color: #07111f;
        }

        /* Page Styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #07111f;
            color: white;
        }

        .content {
            text-align: center;
            padding: 80px 20px;
        }

    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Page Content -->
    <div class="content">
        <h1>Styled Navigation Bar</h1>
        <p>This webpage demonstrates a navigation bar using CSS.</p>
    </div>

</body>

</html>
```
