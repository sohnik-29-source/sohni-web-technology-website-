<!DOCTYPE html>
<html>
<head>
    <title>Width Height Sizing</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .fixed {
            width: 300px;
            height: 100px;
            background: #312e81;
            margin-bottom: 20px;
        }

        .percentage {
            width: 70%;
            height: 100px;
            background: #155e75;
            margin-bottom: 20px;
        }

        .sized {
            min-width: 250px;
            max-width: 600px;
            min-height: 80px;
            max-height: 150px;
            background: #7c3aed;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Width, Height and Sizing</h1>

    <div class="fixed">Fixed Size</div>

    <div class="percentage">Percentage Width</div>

    <div class="sized">Minimum and Maximum Size</div>

</body>
</html>
