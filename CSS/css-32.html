```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows</title>

    <style>
        body {
            margin: 0;
            padding: 60px;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #22d3ee;
            text-shadow: 3px 3px 8px #000;
        }

        .box {
            width: 300px;
            margin: 50px auto;
            padding: 40px;
            background: #101d31;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>

<body>

    <h1>Text Shadow</h1>

    <div class="box">
        <h2>Box Shadow</h2>
        <p>This box demonstrates CSS box-shadow.</p>
    </div>

</body>

</html>
```
