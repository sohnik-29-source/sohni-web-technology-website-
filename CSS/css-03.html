<!DOCTYPE html>
<html>
<head>
    <title>Colors Backgrounds Borders</title>

    <style>
        body {
            background-color: #07111f;
            font-family: Arial;
            padding: 50px;
        }

        .box {
            background-color: #172554;
            color: #67e8f9;
            border: 3px solid #22d3ee;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #f472b6;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>CSS Colors</h1>
        <p>Background and Border Demonstration</p>
    </div>

</body>
</html>
