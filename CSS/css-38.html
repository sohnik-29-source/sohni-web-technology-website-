```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Visibility</title>

    <style>
        body {
            margin: 0;
            padding: 50px;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .box {
            width: 200px;
            padding: 25px;
            margin: 20px auto;
            background: #22d3ee;
            color: #07111f;
        }

        .visible {
            visibility: visible;
        }

        .hidden {
            visibility: hidden;
        }

        .display-none {
            display: none;
        }
    </style>
</head>

<body>

    <h1>Visibility and Hiding</h1>

    <div class="box visible">
        Visible Element
    </div>

    <div class="box hidden">
        Hidden Element
    </div>

    <div class="box display-none">
        Display None Element
    </div>

    <div class="box">
        Normal Element
    </div>

</body>

</html>
