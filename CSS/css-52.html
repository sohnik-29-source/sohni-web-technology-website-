```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Footer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
        }

        .content {
            min-height: 70vh;
            padding: 50px;
            text-align: center;
        }

        footer {
            background: #101d31;
            padding: 40px;
            display: flex;
            justify-content: space-around;
            gap: 30px;
        }

        footer div {
            flex: 1;
            text-align: center;
        }

        footer h3 {
            color: #22d3ee;
        }

        footer a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            margin: 8px;
        }

        @media (max-width: 600px) {
            footer {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>Responsive Footer</h1>
        <p>Resize the browser window to see the footer respond.</p>
    </div>

    <footer>

        <div>
            <h3>WebLab</h3>
            <p>Learn Web Development.</p>
        </div>

        <div>
            <h3>Links</h3>
            <a href="#">Home</a>
            <a href="#">About</a>
        </div>

        <div>
            <h3>Contact</h3>
            <p>info@example.com</p>
        </div>

    </footer>

</body>

</html>
