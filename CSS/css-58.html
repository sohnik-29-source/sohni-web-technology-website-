```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #101d31;
        }

        header h1 {
            color: #22d3ee;
        }

        .hero {
            min-height: 450px;
            background-image: url("https://picsum.photos/1400/600?travel");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-content {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
        }

        .destinations {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .destination {
            width: 250px;
            padding: 25px;
            background: #101d31;
            text-align: center;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Explore World</h1>
    </header>

    <section class="hero">

        <div class="hero-content">
            <h2>Discover Amazing Places</h2>
            <p>Plan your next unforgettable journey.</p>
        </div>

    </section>

    <section class="destinations">

        <div class="destination">
            <h2>Paris</h2>
            <p>Explore the city of lights.</p>
        </div>

        <div class="destination">
            <h2>Dubai</h2>
            <p>Experience modern luxury.</p>
        </div>

        <div class="destination">
            <h2>Maldives</h2>
            <p>Relax on beautiful beaches.</p>
        </div>

    </section>

</body>

</html>
