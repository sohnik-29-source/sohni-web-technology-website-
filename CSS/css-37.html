```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Properties</title>

    <style>
        body {
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
        }

        .block {
            display: block;
            background: #22d3ee;
            padding: 15px;
            margin: 10px;
        }

        .inline {
            display: inline;
            background: #8b5cf6;
            padding: 15px;
        }

        .inline-block {
            display: inline-block;
            background: #f472b6;
            padding: 20px;
            margin: 20px;
        }

        .none {
            display: none;
        }
    </style>
</head>

<body>

    <h1>CSS Display Properties</h1>

    <div class="block">Block Element</div>

    <span class="inline">Inline Element</span>

    <div class="inline-block">Inline-Block Element</div>

    <div class="none">This element uses display: none.</div>

</body>

</html>
