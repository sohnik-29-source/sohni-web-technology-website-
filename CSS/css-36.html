```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index</title>

    <style>
        body {
            margin: 0;
            padding: 50px;
            background: #07111f;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            position: relative;
            width: 500px;
            height: 350px;
            margin: 50px auto;
        }

        .box {
            position: absolute;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .one {
            background: #22d3ee;
            left: 50px;
            top: 50px;
            z-index: 1;
        }

        .two {
            background: #8b5cf6;
            left: 150px;
            top: 100px;
            z-index: 2;
        }

        .three {
            background: #f472b6;
            left: 250px;
            top: 150px;
            z-index: 3;
        }
    </style>
</head>

<body>

    <h1>Z-Index and Stacking Order</h1>

    <div class="container">

        <div class="box one">z-index: 1</div>

        <div class="box two">z-index: 2</div>

        <div class="box three">z-index: 3</div>

    </div>

</body>

</html>
