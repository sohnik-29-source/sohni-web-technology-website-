```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping</title>

    <style>
        body {
            margin: 0;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        header {
            background: #101d31;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .products {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 40px;
        }

        .product {
            width: 250px;
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .price {
            color: #2563eb;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Online Store</h1>
    </header>

    <div class="products">

        <div class="product">
            <img src="https://picsum.photos/300/200?1" alt="Product">
            <h2>Watch</h2>
            <p class="price">₹1,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/300/200?2" alt="Product">
            <h2>Headphones</h2>
            <p class="price">₹2,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="https://picsum.photos/300/200?3" alt="Product">
            <h2>Backpack</h2>
            <p class="price">₹1,299</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>

</html>
