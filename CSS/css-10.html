<!DOCTYPE html>
<html>
<head>
    <title>CSS Pseudo Classes</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 50px;
        }

        a {
            color: #22d3ee;
            font-size: 20px;
        }

        a:visited {
            color: #a78bfa;
        }

        a:hover {
            color: #f472b6;
        }

        a:active {
            color: yellow;
        }

        input {
            padding: 12px;
            background: #101d31;
            color: white;
            border: 2px solid #334155;
        }

        input:focus {
            border-color: #22d3ee;
            outline: none;
        }
    </style>
</head>

<body>

    <h1>Pseudo-classes</h1>

    <a href="https://example.com">Visit Link</a>

    <br><br>

    <input type="text" placeholder="Focus on me">

</body>
</html>
