<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>

    <style>
        body {
            background: #07111f;
            color: white;
            font-family: Arial;
            padding: 40px;
        }

        .box {
            float: left;
            width: 150px;
            height: 100px;
            background: #22d3ee;
            margin-right: 20px;
        }

        .clear {
            clear: both;
            background: #312e81;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Float Property</h1>

    <div class="box"></div>

    <p>
        This text flows around the floated element.
    </p>

    <div class="clear">
        This element uses the clear property.
    </div>

</body>
</html>
